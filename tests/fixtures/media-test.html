<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba multimedia ChatDuck</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#111827;color:#f9fafb}
  button{padding:.7rem 1rem;margin:.3rem;border:0;border-radius:.5rem;cursor:pointer}
  #status{padding:.8rem;background:#1f2937;border-radius:.5rem}
</style>
<h1>Prueba multimedia</h1>
<p>Genera un tono muy bajo para probar pausa y restauración del elemento HTML audio.</p>
<button id="start">Iniciar audio de prueba</button>
<button id="stop">Detener audio de prueba</button>
<label>Volumen del audio: <input id="volume" type="range" min="0" max="100" value="5"><output id="level">5%</output></label>
<p id="status" role="status" aria-live="polite">Audio detenido.</p>
<audio id="player" src="tone.wav" loop preload="auto"></audio>
<script>
  const player = document.querySelector("#player");
  const status = document.querySelector("#status");
  const volume = document.querySelector("#volume");
  const level = document.querySelector("#level");
  player.volume = 0.05;
  volume.addEventListener("input", () => { player.volume = Number(volume.value) / 100; });
  player.addEventListener("volumechange", () => {
    volume.value = String(Math.round(player.volume * 100));
    level.value = `${volume.value}%`;
  });
  document.querySelector("#start").addEventListener("click", async () => {
    try { await player.play(); } catch (error) { status.textContent = `No se pudo iniciar: ${error.message}`; }
  });
  document.querySelector("#stop").addEventListener("click", () => player.pause());
  player.addEventListener("play", () => { status.textContent = "Audio de prueba reproduciéndose."; });
  player.addEventListener("pause", () => { status.textContent = "Audio de prueba pausado."; });
</script>
</html>
