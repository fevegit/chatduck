<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Ducking modal preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#11131a;color:#e7eaf1;font:15px/1.5 system-ui,sans-serif}
    .demo{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 18%,#34304a,#171922 52%,#11131a)}
    .demo-card{width:min(740px,88vw);padding:32px;border:1px solid #353744;border-radius:18px;background:#1b1d26;box-shadow:0 24px 80px #0008}
    .demo h1{margin:0 0 8px;font-size:24px}.demo p{color:#adb0bd}.demo button{padding:9px 12px;border:1px solid #62548b;border-radius:8px;background:#302940;color:#fff;cursor:pointer}
  </style>
  <script src="/src/core.js?v=277"></script>
  <script src="/src/i18n.js?v=277"></script>
  <script src="/src/settings-page.js?v=277"></script>
</head>
<body>
  <main class="demo"><section class="demo-card"><h1>Example media page</h1><p>This page stands in for a supported website while the settings overlay is tested. It does not play media or connect to the Windows agent.</p><button id="open-settings" type="button">Open Audio Ducking settings</button></section></main>
  <script>
    const storageKey = "audioDuckingPreviewSettings";
    const defaults = { mode: "duck", targetVolumePercent: 12, language: "en", playerRules: { plexWeb: { mode: "pause" } }, windowsApps: [{ path: "C:\\Program Files\\Plex\\Plex\\Plex.exe", enabled: true, appUserModelIds: [] }], customSites: [{ domain: "media.example.org", enabled: true }], plexOrigins: ["http://192.168.1.25:32400"] };
    let settings = AudioDuckCore.normalizeSettings(JSON.parse(localStorage.getItem(storageKey) || JSON.stringify(defaults)));
    const page = new AudioDuckSettingsPage.SettingsPage({
      doc: document,
      getSettings: () => settings,
      saveSettings: async (next) => { settings = AudioDuckCore.normalizeSettings(next); localStorage.setItem(storageKey, JSON.stringify(settings)); },
      getState: async () => ({ agent: { ok: false }, apps: [] }),
      onError: (error) => console.error("Preview error", error)
    });
    window.previewAudioDuckingPage = page;
    document.querySelector("#open-settings").addEventListener("click", () => page.open());
    window.previewAudioDuckingSettings = () => settings;
  </script>
</body>
</html>
