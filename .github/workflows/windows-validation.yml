name: Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install:
    name: Build and install MSI on hosted Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e289664e5dc5ba9c38d # v6.5.0
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $toolPath wix --version 4.0.3
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          "${toolPath}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolPath 'wix.exe') extension add --global WixToolset.UI.wixext/4.0.3
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed.' }

      - name: Build public userscript, Windows agent, MSI, and SHA-256 manifest
        shell: pwsh
        run: ./scripts/build-release.ps1 -RepositoryUrl 'https://github.com/fevegit/chatduck'

      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs

      - name: Run native agent tests
        shell: pwsh
        run: |
          dotnet run --project tests/agent-volume/Agent.Volume.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Agent volume tests failed.' }
          dotnet run --project tests/agent-protocol/Agent.Protocol.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Agent protocol tests failed.' }

      - name: Validate release files and hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'release-artifacts').Path
          $userscript = Join-Path $root 'ChatDuck.user.js'
          $msi = Join-Path $root 'ChatDuck-Windows-Agent-2.7.5-alpha.1-x64.msi'
          $manifest = Join-Path $root 'SHA256SUMS.txt'
          foreach ($path in @($userscript, $msi, $manifest)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $([IO.Path]::GetFileName($path))" }
          }
          $expected = Get-Content -LiteralPath $manifest
          if ($expected.Count -ne 2) { throw 'SHA256SUMS.txt must contain exactly two assets.' }
          foreach ($path in @($userscript, $msi)) {
            $name = [IO.Path]::GetFileName($path)
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if (-not ($expected -contains "$hash  $name")) { throw "SHA-256 manifest mismatch for $name." }
          }
          if ((Get-Item -LiteralPath $msi).Length -lt 1MB) { throw 'The MSI is unexpectedly small.' }
          "Validated userscript, MSI, and SHA-256 manifest." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Install, exercise, and uninstall the MSI
        shell: pwsh
        run: ./tests/ci/windows-installer-smoke.ps1 -MsiPath './release-artifacts/ChatDuck-Windows-Agent-2.7.5-alpha.1-x64.msi'
