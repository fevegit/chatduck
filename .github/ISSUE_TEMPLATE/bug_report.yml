name: Bug report
description: Report a reproducible Audio Ducking problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, pairing codes, usernames, private paths, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Audio Ducking version
      placeholder: 2.7.5
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Player and mode
      placeholder: Spotify Web — Ducking
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, pairing codes, usernames, personal paths, and private log data.
          required: true
